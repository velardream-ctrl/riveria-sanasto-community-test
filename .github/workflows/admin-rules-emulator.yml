name: TEST admin isolated Firestore rules contract
on:
  push:
    branches:
      - feat/admin-control-center-package-spec-20261104
    paths:
      - '.github/workflows/admin-rules-emulator.yml'
      - 'admin/security-tests/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/admin-rules-emulator.yml'
      - 'admin/security-tests/**'
permissions:
  contents: read
jobs:
  emulator-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated emulator dependencies
        working-directory: admin/security-tests
        run: npm install --no-audit --no-fund
      - name: Run Firestore rules against local emulator (never deploy)
        working-directory: admin/security-tests
        env:
          CI: 'true'
        run: npm run test:emulator
